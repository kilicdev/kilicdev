name: Refresh README profile visual

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "readme/**"
      - ".github/workflows/readme-image.yml"

permissions:
  contents: write

concurrency:
  group: readme-profile-visual
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile visual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node readme/generate.js

      - name: Commit updated visual when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/libs/readme-stats.svg
          if git diff --cached --quiet; then
            echo "README visual is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh README profile visual"
          git push
